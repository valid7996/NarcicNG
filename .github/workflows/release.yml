name: Android Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/release-key.jks

      - name: Download libv2ray.aar
        run: |
          mkdir -p app/libs
          rm -f app/libs/*.aar
          curl -L "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.5/libv2ray.aar" -o app/libs/libv2ray.aar

      - name: Build Release APKs
        env:
          RELEASE_STORE_FILE: release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-build-cache

      - name: Rename APKs
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk output/NarcicNG-arm64.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk output/NarcicNG-armeabi.apk
          cp app/build/outputs/apk/release/app-universal-release.apk output/NarcicNG-universal.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Narcic NG ${{ github.ref_name }}"
          body: |
            ## Narcic NG ${{ github.ref_name }}

            ### 📥 دانلود
            | فایل | توضیح |
            |------|-------|
            | `NarcicNG-arm64.apk` | اکثر گوشی‌های جدید (پیشنهادی) |
            | `NarcicNG-armeabi.apk` | گوشی‌های قدیمی‌تر |
            | `NarcicNG-universal.apk` | همه گوشی‌ها |

            ### 📢 پشتیبانی
            کانال تلگرام: [@Narcic_Support](https://t.me/Narcic_Support)
          files: |
            output/NarcicNG-arm64.apk
            output/NarcicNG-armeabi.apk
            output/NarcicNG-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
